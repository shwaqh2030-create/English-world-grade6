<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English World | Grade 6 — Grammar Quest</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#563a68;background:#f8e8f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 15%,#fff1c8 0,transparent 34%),radial-gradient(circle at 90% 80%,#e9dbff 0,transparent 35%),linear-gradient(145deg,#fff4ed,#f8e1f2 65%,#f2e9ff);padding:26px 14px 42px}.wrap{max-width:650px;margin:auto}.header{text-align:center;padding:22px 5px 18px}.tag{display:inline-block;background:#fff9ff;border:1px solid #f0d7ed;padding:10px 20px;border-radius:99px;color:#a25c9e;font-weight:750;box-shadow:0 4px 20px #b478b314}h1{font-size:clamp(30px,7vw,44px);color:#8a469b;margin:18px 0 8px}header p{margin:0;color:#896f91;font-size:16px}.card{background:#fffbffed;border:2px solid white;border-radius:32px;box-shadow:0 20px 48px #ac6aa329;padding:clamp(20px,5vw,36px)}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800;font-size:15px}.progress{height:13px;background:#efdfef;border-radius:100px;overflow:hidden;margin:20px 0 22px}.bar{height:100%;background:linear-gradient(90deg,#e69bbb,#9971dc);width:0;transition:width .3s}.topic{display:inline-block;border-radius:99px;background:#f5e8ff;color:#8855a2;padding:8px 14px;font-size:13px;font-weight:800}.prompt{font-size:clamp(23px,5vw,29px);line-height:1.45;font-weight:800;color:#57335f;margin:20px 0 22px}.choices{display:grid;gap:12px}.choice{width:100%;border:2px solid #e9d0e9;background:white;border-radius:18px;padding:17px 16px;text-align:left;color:#624169;font-size:18px;font-weight:750;cursor:pointer;transition:background .2s,border-color .2s}.choice:focus-visible,.next:focus-visible,.restart:focus-visible{outline:3px solid #7255cc;outline-offset:3px}.choice:disabled{cursor:default;opacity:1}.choice.correct{border-color:#65b99c;background:#eafaf3;color:#237b5d}.choice.wrong{border-color:#e899a6;background:#fff0f1;color:#a34858}.feedback{margin-top:16px;padding:14px 16px;border-radius:16px;background:#f6edf8;color:#694e70;line-height:1.5;font-weight:650;min-height:55px}.feedback:empty{display:none}.next,.restart{width:100%;margin-top:18px;border:0;border-radius:18px;padding:18px;background:linear-gradient(100deg,#e88faf,#9163d2);color:white;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #a66ea42b}.next:disabled{opacity:.45;cursor:not-allowed}.signature{text-align:center;margin-top:24px;color:#a46b9e;font-size:15px}.finish{text-align:center}.finish h2{font-size:32px;color:#8a469b}.score{font-size:64px;font-weight:900;color:#8555af;margin:12px 0}.small{font-size:15px;color:#8c7493}.hidden{display:none}@media(min-width:540px){.choices{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><header class="header"><div class="tag">🌸 English World | Grade 6 🌸</div><h1>🦋 Grammar Quest 🎮</h1><p>A few · A little · Zero & First Conditional</p></header><main class="card" id="game"><div class="meta"><span id="counter">Question 1 / 10</span><span id="score">⭐ 0 points</span></div><div class="progress" aria-label="Quiz progress"><div class="bar" id="bar"></div></div><div id="topic" class="topic"></div><div id="prompt" class="prompt"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="next" disabled>Next Question ➜</button><div class="signature">Your Teacher: Ashwaq Aljaza 💕</div></main><section id="finish" class="card finish hidden" aria-live="polite"><div style="font-size:54px">🏆🌷✨</div><h2>Wonderful Work!</h2><p>You finished the Grade 6 Grammar Quest!</p><div class="score" id="finalScore">0 / 10</div><p id="message"></p><button id="restart" class="restart">Play Again ↻</button><div class="signature">Your Teacher: Ashwaq Aljaza 💕</div></section></div><script>
const questions=[
{topic:'A few / A little',q:'I have ____ pencils in my bag.',a:['a little','a few','much','any'],correct:1,why:'Pencils are countable plural nouns, so we use “a few”.'},
{topic:'A few / A little',q:'There is ____ milk in the glass.',a:['a few','many','a little','several'],correct:2,why:'Milk is uncountable, so we use “a little”.'},
{topic:'A few / A little',q:'We need ____ eggs to make a cake.',a:['a few','a little','much','any'],correct:0,why:'Eggs are countable, so “a few” is correct.'},
{topic:'A few / A little',q:'Can you add ____ sugar to my tea?',a:['a few','many','several','a little'],correct:3,why:'Sugar is uncountable, so “a little” is correct.'},
{topic:'A few / A little',q:'There are ____ books on the desk.',a:['a little','much','a few','any'],correct:2,why:'Books are countable plural nouns, so we use “a few”.'},
{topic:'Zero Conditional',q:'If you heat ice, it ____ .',a:['melts','will melt','melted','melting'],correct:0,why:'Zero conditional describes a general fact: If + present simple, present simple.'},
{topic:'First Conditional',q:'If it rains tomorrow, we ____ at home.',a:['stay','stayed','will stay','staying'],correct:2,why:'First conditional: If + present simple, will + base verb.'},
{topic:'Zero Conditional',q:'If people do not drink water, they ____ thirsty.',a:['will got','get','gets','getting'],correct:1,why:'For general truths, use the present simple in both clauses.'},
{topic:'First Conditional',q:'If she studies hard, she ____ the test.',a:['passes','passed','passing','will pass'],correct:3,why:'A possible future result uses “will” + base verb.'},
{topic:'First Conditional',q:'If I ____ early, I will call you.',a:['finish','will finish','finished','finishing'],correct:0,why:'In the if-clause of the first conditional, use the present simple.'}
];
let index=0,points=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;let x=questions[index];$('counter').textContent=`Question ${index+1} / ${questions.length}`;$('score').textContent=`⭐ ${points} ${points===1?'point':'points'}`;$('bar').style.width=`${index/questions.length*100}%`;$('topic').textContent=x.topic;$('prompt').textContent=x.q;$('choices').innerHTML='';$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===questions.length-1?'See My Results 🏆':'Next Question ➜';x.a.forEach((option,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+option;b.onclick=()=>choose(i);$('choices').appendChild(b)})}function choose(i){if(answered)return;answered=true;let x=questions[index];let good=i===x.correct;if(good)points++;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===x.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('score').textContent=`⭐ ${points} ${points===1?'point':'points'}`;$('feedback').textContent=(good?'✅ Great job! ':'💗 Nice try! ')+x.why;$('next').disabled=false}$('next').onclick=()=>{index++;if(index<questions.length){render()}else{$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('finalScore').textContent=`${points} / ${questions.length}`;$('message').textContent=points===10?'Perfect score! You are a grammar star! 🌟':points>=7?'Amazing effort! Keep shining! 🌷':'Good try! Practice and play again! 💕'}};$('restart').onclick=()=>{index=0;points=0;$('finish').classList.add('hidden');$('game').classList.remove('hidden');render()};render();
</script></body></html>
